<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animation lab</title>
<style>body{margin:0;font:14px system-ui;background:#f3f2ee}#v{width:100vw;height:80vh}select,button{font-size:16px;margin:6px}</style>
</head><body>
<select id="sel"></select><button id="freeze">s=0</button><button id="freeze1">s=1</button><button id="play">play</button>
<div id="v"></div>
<script type="module">
import { Viewer } from './src/three/viewer.js';
import { LIBRARY } from './src/data/exercises.js';
const exs = LIBRARY.flatMap(e => e.variants ? e.variants.map(v => ({...e, ...v, name: e.name + ' / ' + v.label})) : [e]);
const v = new Viewer(); window.viewer = v; v.mount(document.getElementById('v'));
const sel = document.getElementById('sel');
sel.innerHTML = exs.map((e,i)=>`<option value=${i}>${e.name}</option>`).join('');
const show = () => { v.show(exs[sel.value]); };
sel.onchange = show;
const q = new URLSearchParams(location.search);
if (q.get('i')) sel.value = q.get('i');
if (q.get('id')) sel.value = exs.findIndex(e => e.id === q.get('id'));
show(); v.start();
window.freeze = (s) => { v.stop(); const a = v.anim; v.figure.applyPose(a.pose(s)); v.figure.setGlow(s); v.props.update(); v.renderOnce(); };
window.cam = (az, el, dist, y) => { v.defaultCam = {...v.defaultCam, az, el, dist: dist ?? v.defaultCam.dist, y: y ?? v.defaultCam.y}; v.resetView(); v.renderOnce(); };
document.getElementById('freeze').onclick = () => freeze(0);
document.getElementById('freeze1').onclick = () => freeze(1);
document.getElementById('play').onclick = () => v.start();
window.ready = true;
</script></body></html>
