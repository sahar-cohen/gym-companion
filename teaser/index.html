<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=960, initial-scale=1" />
    <title>Spot. Teaser</title>
    <link rel="stylesheet" href="./teaser.css" />
  </head>
  <body>
    <div id="stage">
      <div id="bg"></div>
      <div id="halo"></div>
      <div id="back"></div>
      <canvas id="gl" width="1920" height="1080"></canvas>
      <svg id="fx" viewBox="0 0 960 540" width="960" height="540"></svg>
      <div id="front"></div>
      <div id="hud">
        <span class="hud-tl"></span><span class="hud-tr"></span>
        <span class="hud-bl"></span><span class="hud-br"></span>
        <i class="crop c1"></i><i class="crop c2"></i><i class="crop c3"></i><i class="crop c4"></i>
      </div>
      <div id="logo">
        <div class="word"><span class="mask"><span class="ch">S</span></span><span class="mask"><span class="ch">p</span></span><span class="mask"><span class="ch">o</span></span><span class="mask"><span class="ch">t</span></span><span class="stop-slot"></span></div>
        <div class="tag"><span class="mask"><span class="tw">Every</span></span> <span class="mask"><span class="tw">rep,</span></span> <span class="mask"><span class="tw">spotted.</span></span></div>
      </div>
      <div id="dot"></div>
      <div id="flash"></div>
      <div id="vignette"></div>
      <canvas id="grain" width="960" height="540"></canvas>
    </div>
    <script type="module" src="./teaser.js"></script>
  </body>
</html>
